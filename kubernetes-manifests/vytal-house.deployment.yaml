apiVersion: apps/v1
kind: Deployment
metadata:
  name: vytal-house-web
  labels:
    app: vytal-house-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vytal-house-web
  template:
    metadata:
      labels:
        app: vytal-house-web
    spec:
      containers:
        - name: web
          image: gcr.io/vytal-house/vytal-house-web:latest
          ports:
          - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
